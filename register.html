
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register - Household Expense Manager</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center register-container">

    <div class="card shadow p-4 register-card">

        <h3 class="text-center mb-2">
            Household Expense Manager
        </h3>

        <h5 class="text-center text-muted mb-4">
            Create Account
        </h5>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="mb-3">
                <label class="form-label">Full Name</label>

                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter your full name"
                       autocomplete="name"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Create a password"
                       minlength="6"
                       autocomplete="new-password"
                       required>

                <small class="text-muted">
                    Minimum 6 characters.
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm your password"
                       minlength="6"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Create Account
            </button>

        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>

</body>
</html>
