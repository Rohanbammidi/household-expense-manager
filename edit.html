
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Expense</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container edit-container mt-5 mb-5">

    <div class="card shadow p-4 mx-auto edit-card">

        <h2 class="text-center mb-4">Edit Expense</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Expense Name</label>

                <input type="text"
                       name="item_name"
                       class="form-control"
                       value="{{ expense['item_name'] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>

                <input type="number"
                       name="amount"
                       class="form-control"
                       min="0.01"
                       step="0.01"
                       value="{{ expense['amount'] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select name="category" class="form-select" required>

                    <option value="Food"
                        {% if expense['category'] == 'Food' %}selected{% endif %}>
                        Food
                    </option>

                    <option value="Transport"
                        {% if expense['category'] == 'Transport' %}selected{% endif %}>
                        Transport
                    </option>

                    <option value="Shopping"
                        {% if expense['category'] == 'Shopping' %}selected{% endif %}>
                        Shopping
                    </option>

                    <option value="Education"
                        {% if expense['category'] == 'Education' %}selected{% endif %}>
                        Education
                    </option>

                    <option value="Medical"
                        {% if expense['category'] == 'Medical' %}selected{% endif %}>
                        Medical
                    </option>

                    <option value="Entertainment"
                        {% if expense['category'] == 'Entertainment' %}selected{% endif %}>
                        Entertainment
                    </option>

                    <option value="Utilities"
                        {% if expense['category'] == 'Utilities' %}selected{% endif %}>
                        Utilities
                    </option>

                    <option value="Others"
                        {% if expense['category'] == 'Others' %}selected{% endif %}>
                        Others
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Expense Date</label>

                <input type="date"
                       name="expense_date"
                       class="form-control"
                       value="{{ expense['expense_date'] }}"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Update Expense
            </button>

        </form>

        <a href="/" class="btn btn-outline-secondary mt-3 w-100">
            Cancel
        </a>

    </div>

</div>

</body>
</html>
